services:
  r-dev:
    image: r-neovim-dev:4.4.1
    container_name: r-dev
    volumes:
      # :Z sets the correct SELinux label — required on most work systems
      - ./CAdir_results:/CAdir_results:Z
      # Optional: persist neovim config from host
      - ~/.config/nvim:/root/.config/nvim:Z
    stdin_open: true
    tty: true
    working_dir: /CAdir_results
